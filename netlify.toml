[build]
  # The application is deployed on Vercel. This site only retires the old origin.
  command = "node -e \"console.log('Netlify migration redirect only')\""
  publish = "netlify/redirect"

[build.environment]
  NODE_VERSION = "24.22.1"

[functions]
  # Keep old API source for history/tests, but do not deploy it to the old origin.
  directory = "netlify/disabled-functions"
